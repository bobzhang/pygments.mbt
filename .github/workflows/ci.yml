name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: moon version --all

      - name: Update registry index
        run: moon update

      - name: Format check
        run: moon fmt --check

      - name: Interface check
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

      - name: Check
        run: moon check --target native

      - name: Test (native)
        run: moon test --target native

      - name: Test (js)
        run: moon test --target js

      - name: Test (wasm-gc)
        run: moon test --target wasm-gc

      - name: Build pygmentize
        run: |
          moon build --target native --release cmd/pygmentize
          printf 'def f(x):\n    return x + 1\n' > /tmp/t.py
          ./_build/native/release/build/cmd/pygmentize/pygmentize.exe -f html /tmp/t.py

      - name: Build pygmentize (wasm, as run by moonx)
        run: |
          moon build --target wasm --release cmd/pygmentize
          moonrun _build/wasm/release/build/cmd/pygmentize/pygmentize.wasm -- -f terminal256 /tmp/t.py
          echo 'print(1)' | moonrun _build/wasm/release/build/cmd/pygmentize/pygmentize.wasm -- -l python -f html

      - name: Build scat (native and wasm)
        run: |
          moon build --target native --release cmd/scat
          moon build --target wasm --release cmd/scat
          ./_build/native/release/build/cmd/scat/scat.exe -n /tmp/t.py
          moonrun _build/wasm/release/build/cmd/scat/scat.wasm -- -s monokai /tmp/t.py
          printf 'fn main {\n  println("hi")\n}\n' > /tmp/t.mbt
          moonrun _build/wasm/release/build/cmd/scat/scat.wasm -- /tmp/t.mbt

  conformance:
    name: Conformance against Python Pygments
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update registry index
        run: moon update

      - name: Generated files are up to date
        run: |
          scripts/regen.sh
          git status --short
          git diff --exit-code

      - name: Differential tests (regex, lexers, analyse, formatters, CLI)
        run: scripts/conformance.sh
